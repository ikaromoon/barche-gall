  #ess { display:none; }
  body.ess { background:#1c1f22; --fondo:#1c1f22; --ink:#f2f4f5; --ink2:rgba(242,244,245,.62); --ink3:rgba(242,244,245,.34);

<script>
// l'app sostituisce il segnaposto con l'area vera; aperta da sola nel browser usa l'area standard
const BOUNDS = JSON.parse('%%BOUNDS%%'.charAt(0) === '[' ? '%%BOUNDS%%' : '[[39.9942,17.8501],[40.0694,18.0247]]');
const DOT = 7;
const SBIADISCI = 120;
const GAP = 10;
const RADII = [28, 55, 90, 135, 190, 255, 330, 420, 520, 640];
const LINK_MIN = DOT + 22;        // pixel minimi di linea visibile tra pallino e fumetto
const ANGLES = [-45,-135,45,135,-90,90,0,180,-22.5,-67.5,-112.5,-157.5,22.5,67.5,112.5,157.5]
               .map(d => d * Math.PI / 180);

const map = L.map('map', {zoomControl:false, zoomSnap:0, zoomDelta:0.25, attributionControl:false, keyboard:false});
// mappe di sfondo senza chiave; se la prima da' errori si passa alla successiva
const SFONDI = [
  ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}],
  ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
   {maxZoom:19, attribution:'&copy; Esri'}],
  ['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
   {subdomains:'abcd', maxZoom:20, attribution:'&copy; OpenStreetMap &copy; CARTO'}],
];
let sfondo = null, nSfondo = 0, erroriSfondo = 0;
function usaSfondo(i) {
  if (sfondo) map.removeLayer(sfondo);

// ---------- zone raggruppate (porti) ----------
// Le barche ferme dentro una zona si riuniscono in un solo fumetto con l'elenco, se sono almeno 2.
// Solo nella vista d'insieme: avvicinandosi (zoom) il gruppo si scioglie nei fumetti singoli con le foto.
// Nomi, centri e raggi (in metri) si possono cambiare qui.
const ZONE = [
  {nome: 'Porto di Gallipoli', lat: 40.0575, lon: 17.9830, raggio: 350},
  {nome: 'Porto turistico',    lat: 40.0668, lon: 18.0016, raggio: 300},
];
const DIAM_MAX = 850;                // tetto: due barche della stessa zona non possono distare piu' di 850 m
let DIST_GRUPPO = 300;               // fuori dai porti: barche ferme a meno di 300 m tra loro = "Zona A", "Zona B"...
const ZOOM_SCIOGLI = 0.8;            // quanto zoom oltre la vista d'insieme serve per sciogliere i gruppi
const MOVIMENTO_M = 80;              // spostata di piu' di 80 m negli ultimi 10 minuti = in movimento
const COLORE_GRUPPO = '#0d3b66';
function distM(a, b) {
  const dy = (a.lat - b.lat) * 111320, dx = (a.lon - b.lon) * 111320 * Math.cos(a.lat * Math.PI / 180);
  return Math.hypot(dx, dy);
}
// posizioni recenti di ogni barca, per capire se si sta muovendo
const storiaPos = {};
function registraPosizioni() {
  const ora = Date.now();
  for (const v of vessels) {
    const st = storiaPos[v.mmsi] || (storiaPos[v.mmsi] = []);
    const u = st[st.length - 1];
    if (!u || u.lat !== v.lat || u.lon !== v.lon) st.push({lat: v.lat, lon: v.lon, t: ora});
    while (st.length > 1 && ora - st[0].t > 15 * 60000) st.shift();
  }
}
function inMovimento(v) {
  const st = storiaPos[v.mmsi], ora = Date.now();
  return !!st && st.some(q => ora - q.t <= 10 * 60000 && distM(q, v) > MOVIMENTO_M);
}
function panoramica() { return !vistaIniziale || map.getZoom() < vistaIniziale.zoom + ZOOM_SCIOGLI; }
let gruppiAttuali = [];
function calcolaGruppi() {
  const gruppi = [], presi = new Set();
  if (!panoramica()) return gruppi;
  for (const z of ZONE) {
    const membri = vessels.filter(v => !presi.has(v.mmsi) && distM(v, z) <= z.raggio && !inMovimento(v));
    if (membri.length < 2) continue;
    membri.sort((a, b) => ((b.len > 0) - (a.len > 0)) || (b.len || 0) - (a.len || 0) || String(a.name).localeCompare(String(b.name)));
    membri.forEach(v => presi.add(v.mmsi));
    gruppi.push({z, membri});
  }
  // gruppi automatici: barche ferme vicine tra loro (catena: A vicina a B, B vicina a C -> stesso gruppo)
  const libere = vessels.filter(v => !presi.has(v.mmsi) && !inMovimento(v))
                        .sort((a, b) => a.lon - b.lon || a.lat - b.lat);     // sempre lo stesso ordine (da ovest)
  const visto = new Set(), auto = [];
  for (const v of libere) {
    if (visto.has(v.mmsi)) continue;
    const membri = [v]; visto.add(v.mmsi);
    for (let i = 0; i < membri.length; i++)
      for (const w of libere)
        if (!visto.has(w.mmsi) && distM(membri[i], w) <= DIST_GRUPPO &&
            membri.every(m => distM(m, w) <= DIAM_MAX)) { visto.add(w.mmsi); membri.push(w); }   // oltre 850 m: zona nuova
    if (membri.length >= 2) auto.push(membri);
  }
  // lettere in ordine da ovest a est, cosi' una zona tiene la sua lettera tra un aggiornamento e l'altro
  const centro = m => ({lat: m.reduce((t, v) => t + v.lat, 0) / m.length, lon: m.reduce((t, v) => t + v.lon, 0) / m.length});
  auto.sort((a, b) => centro(a).lon - centro(b).lon);
  auto.forEach((membri, i) => {
    membri.sort((a, b) => ((b.len > 0) - (a.len > 0)) || (b.len || 0) - (a.len || 0) || String(a.name).localeCompare(String(b.name)));
    gruppi.push({z: {nome: 'Zona ' + String.fromCharCode(65 + i % 26), ...centro(membri)}, membri});
  });
  return gruppi;
}
function gruppoDi(mmsi) { return gruppiAttuali.find(g => g.membri.some(v => v.mmsi === mmsi)); }
function zoomGruppo(g) {
  const b = L.latLngBounds(g.membri.map(v => [v.lat, v.lon]));
  map.flyToBounds(b.pad(0.8), {maxZoom: 17, duration: 1});
}
function fumettoGruppo(g) {
  const el = document.createElement('div');
  el.className = 'bubble gruppo cliccabile';
  el.style.setProperty('--c', COLORE_GRUPPO);
  const righe = g.membri.map(v =>
    '<div class="gr' + (v.age > SBIADISCI ? ' vecchia' : '') + (v.mmsi === sel ? ' sel' : '') + '"><i style="background:' + v.color + '"></i>' +
    esc(v.name) + '<span>' + (v.len ? fmtM(v.len) + ' m' : '-') + '</span></div>').join('');
  // mentre si scorre l'elenco, la barca evidenziata mostra la sua foto (se ce l'ha)
  const evid = g.membri.find(v => v.mmsi === sel);
  const foto = evid && evid.photo ? '<img class="gf" src="' + urlFoto(evid.photo) + '">' : '';
  if (foto) el.classList.add('confoto');
  el.innerHTML = foto + '<div class="gc"><div class="gt">' + esc(g.z.nome) + '<span class="gn">' + g.membri.length + '</span></div>' +
                 '<div class="gl' + (g.membri.length >= 4 ? ' due' : '') + '">' + righe + '</div></div>';
  if (g.membri.some(v => v.mmsi === sel)) el.classList.add('sel');
  el.addEventListener('click', () => zoomGruppo(g));
  return el;
}

// ---------- telecomando ----------
let sel = null;                 // mmsi della barca selezionata
let visibili = [];              // barche disegnate nell'ultimo render: {v, p}
let pannelloVisibile = true;
let timerAiuto = null;
function mostraAiuto(sec) {
  const a = document.getElementById('aiuto');
  a.classList.remove('nascosto');
  clearTimeout(timerAiuto);
  timerAiuto = setTimeout(() => { a.classList.add('nascosto'); setTimeout(render, 700); }, sec * 1000);
}
mostraAiuto(25);
// ordine fisso per Su/Giu: lo stesso del pannello "Barche in scala" (dalla piu' lunga),
// poi quelle senza misure. Si rigenera solo quando una barca compare, sparisce o riceve le misure.
let ordine = [], firmaOrdine = '';
function aggiornaOrdine() {
  // la firma comprende anche la lunghezza: quando arrivano le misure di una barca l'ordine si rifa'
  const firma = vessels.map(v => v.mmsi + ':' + (v.len || 0)).sort().join(',');
  if (firma === firmaOrdine) return;
  firmaOrdine = firma;
  ordine = vessels.slice().sort((a, b) => ((b.len > 0) - (a.len > 0)) || (b.len || 0) - (a.len || 0)
                                         || String(a.name).localeCompare(String(b.name))).map(v => v.mmsi);
}
function scorri(passo) {
  const vis = new Set(visibili.map(o => o.v.mmsi));
  const lista = (essenziale() ? ordineEss : ordine).filter(k => vis.has(k));   // solo quelle sullo schermo, nell'ordine del tema
  if (!lista.length) return;
  const i = lista.indexOf(sel);
  sel = i < 0 ? (passo > 0 ? lista[0] : lista[lista.length - 1]) : lista[(i + passo + lista.length) % lista.length];
  render();
}
function barcaSel() { const o = visibili.find(o => o.v.mmsi === sel); return o ? o.v : null; }
function scegli(dir) {
  if (!visibili.length) return;
  const cur = visibili.find(o => o.v.mmsi === sel);
  if (!cur) {                                       // nessuna selezionata: la piu' vicina al centro
    const c = {x: innerWidth / 2, y: innerHeight / 2};
    visibili.sort((a, b) => Math.hypot(a.p.x - c.x, a.p.y - c.y) - Math.hypot(b.p.x - c.x, b.p.y - c.y));
    sel = visibili[0].v.mmsi; render(); return;
  }
  const ax = {sx: [-1, 0], dx: [1, 0], su: [0, -1], giu: [0, 1]}[dir];
  let best = null, bestScore = Infinity;
  for (const o of visibili) {
    if (o === cur) continue;
    const dx = o.p.x - cur.p.x, dy = o.p.y - cur.p.y;
    const lungo = dx * ax[0] + dy * ax[1];           // quanto e' avanti nella direzione scelta
    const lato = Math.abs(dx * ax[1] - dy * ax[0]);  // quanto e' spostata di lato
    if (lungo <= 2) continue;
    const score = lungo + lato * 2;
    if (score < bestScore) { bestScore = score; best = o; }
  }
  if (best) { sel = best.v.mmsi; render(); }
}
function zoomSu(v) { map.flyTo([v.lat, v.lon], Math.max(17, map.getZoom()), {duration: 1}); }
function tasto(t) {
  if (menuAperto) { gestisciMenu(t); return; }      // menu aperto: i tasti servono al menu
  mostraAiuto(8);
  const fotoAperta = zoom.classList.contains('aperto');
  if (t === 'su' || t === 'giu') { if (!fotoAperta) scorri(t === 'giu' ? 1 : -1); return; }
  if (t === 'sx' || t === 'dx') { if (!fotoAperta) scegli(t); return; }
  if (t === 'ok') {
    if (fotoAperta) { chiudiFoto(); return; }
    const v = barcaSel();
    if (!v) { scegli('dx'); return; }
    const g = gruppoDi(v.mmsi);
    if (g) { zoomGruppo(g); return; }               // barca in un gruppo: si entra nel porto
    if (v.photo) apriFoto(v); else zoomSu(v);
    return;
  }
  if (t === 'play') {
    if (fotoAperta) chiudiFoto();
    const v = barcaSel();
    if (v && inVistaIniziale()) zoomSu(v);
    else map.flyToBounds(BOUNDS, Object.assign({duration: 1}, marginiVista()));
    return;
  }
  if (t === 'piu' || t === 'meno') {
    const v = barcaSel();
    const z = map.getZoom() + (t === 'piu' ? 0.75 : -0.75);
    if (v) map.setZoomAround([v.lat, v.lon], z); else map.setZoom(z);
    return;
  }
  if (t === 'pannello') { if (fotoAperta) chiudiFoto(); menuAperto = true; disegnaMenu(); return; }   // tasto Menu: opzioni
}
// Indietro: true se gestito qui, false = l'app si chiude
function indietro() {
  if (menuAperto) { menuAperto = false; disegnaMenu(); return true; }
  mostraAiuto(8);
  if (zoom.classList.contains('aperto')) { chiudiFoto(); return true; }
  if (!inVistaIniziale()) { map.flyToBounds(BOUNDS, Object.assign({duration: 1}, marginiVista())); return true; }
  if (sel) { sel = null; render(); return true; }
  return false;
}

// ---------- foto grande ----------
const zoom = document.getElementById('zoom');
function apriFoto(v) {
  const img = zoom.querySelector('img');
  img.style.setProperty('--ar', v.ar || 1.5);          // proporzioni della foto: riempie il riquadro
  img.src = urlFoto(v.photo);                       // subito quella piccola gia' in cache...
  const grande = new Image();
  grande.onload = () => { if (zoom.dataset.k === v.photo) img.src = grande.src; };   // ...poi la grande
  grande.src = urlFoto(v.photo, true);
  zoom.dataset.k = v.photo;
  const cl = v.age <= 15 ? 'fresca' : v.age <= SBIADISCI ? 'media' : 'vecchia';
  zoom.querySelector('.info').innerHTML = '<b>' + esc(v.name) + '</b><span>Size: <b>' + esc(v.size || '-') +
    '</b></span><span class="eta ' + cl + '">ultima rilevazione: ' + (v.age < 1 ? 'adesso' : quando(v.age) + ' fa') + '</span>';
  zoom.classList.add('aperto');
}
function chiudiFoto() { zoom.classList.remove('aperto'); zoom.dataset.k = ''; }
zoom.addEventListener('click', e => { if (!e.target.closest('.box') || e.target.closest('.x')) chiudiFoto(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !PROVA) chiudiFoto(); });

function quando(min) { return min < 60 ? min + ' min' : min < 2880 ? Math.round(min / 60) + ' h' : Math.round(min / 1440) + ' giorni'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function refresh() {
  const st = document.getElementById('stato');
  try {
    // in prova i dati arrivano "dopo", come dal server (cosi' la pagina e' gia' tutta caricata)
    const d = PROVA ? await new Promise(ok => setTimeout(() => ok(datiProva()), 0)) : await (await fetch('/api/vessels')).json();
    vessels = d.vessels;
    // "M/P" (motopeschereccio) davanti al nome, maiuscolo o minuscolo: e' sempre un peschereccio,
    // anche se l'AIS non lo dice -> sagoma e colore da pesca
    for (const v of vessels) if (/^\s*m\s*\/\s*p\b/i.test(v.name || '')) { v.type = 'Fishing'; v.color = '#f08a24'; }
    aggiornaOrdine();
    registraPosizioni();
    // una barca gia' sulla mappa non e' piu' "in arrivo", anche se l'ultima lettura di MarineTraffic
    // (ogni 3 minuti) la vedeva ancora fuori: niente freccia doppia
    const normN = n => String(n || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const presenti = new Set(vessels.map(v => normN(v.name)));
    arrivi = (d.arrivi || []).filter(a => !presenti.has(normN(a.name)));
    coloraArrivi();
    st.className = d.error ? 'err' : '';
    st.textContent = d.error ? ('Errore: ' + d.error)
                             : (vessels.length + ' barche (' + vessels.filter(v => v.age > SBIADISCI).length + ' non aggiornate da oltre ' + quando(SBIADISCI) + ') - aggiornato ' + (d.updated || '...'));
    ultimoStato = {testo: st.textContent, err: !!d.error};
    render();
  } catch (e) { st.className = 'err'; st.textContent = 'Server non raggiungibile'; ultimoStato = {testo: st.textContent, err: true}; if (essenziale()) render(); }
}
setInterval(refresh, 10 * 1000);
refresh();
map.on('move zoom', render);

// fumetti proporzionati alla finestra: 1920x1080 = dimensione piena
let K = 1;
function aggiornaScala() {
  K = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.documentElement.style.setProperty('--s', 1.0 * K);
}
aggiornaScala();

function render() {
  if (essenziale()) { renderEss(); return; }
  aggiornaScala();
  dots.clearLayers(); labels.innerHTML = ''; svg.innerHTML = '';
  const W = innerWidth, H = innerHeight;
  const items = [];
  gruppiAttuali = calcolaGruppi();
  const nelGruppo = new Set();
  for (const g of gruppiAttuali) g.membri.forEach(v => nelGruppo.add(v.mmsi));
  visibili = [];
  for (const v of vessels) {
    const p = map.latLngToContainerPoint([v.lat, v.lon]);
    if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) continue;
    visibili.push({v, p});
    if (nelGruppo.has(v.mmsi)) continue;               // e' dentro il fumetto del suo gruppo
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.setProperty('--c', v.color);
    const ar = Math.max(0.75, Math.min(2.0, v.ar || 1.5));           // proporzione della foto
    const hFoto = 190 * 1.0 * K / ar;
    el.innerHTML = (v.photo ? '<img style="height:' + hFoto + 'px" src="' + urlFoto(v.photo) + '">' : '') +
      '<div class="tx"><div class="nm">' + esc(v.name) + '</div>' +
      '<div class="sz">Size: <b>' + esc(v.size || '-') + '</b></div>' +
      '<div class="eta ' + (v.age <= 15 ? 'fresca' : v.age <= SBIADISCI ? 'media' : 'vecchia') + '">ultima rilevazione: ' +
      (v.age < 1 ? 'adesso' : quando(v.age) + ' fa') + '</div></div>';
    if (v.age > SBIADISCI) el.classList.add('vecchia');
    if (v.mmsi === sel) el.classList.add('sel');
    if (v.photo) { el.classList.add('cliccabile'); el.addEventListener('click', () => apriFoto(v)); }
    labels.appendChild(el);
    items.push({v, p, el, w: el.offsetWidth, h: el.offsetHeight});
  }
  // un fumetto per ogni gruppo, collegato al cerchio tratteggiato che racchiude le sue barche
  for (const g of gruppiAttuali) {
    const pts = g.membri.map(v => map.latLngToContainerPoint([v.lat, v.lon]));
    const c = {x: pts.reduce((t, q) => t + q.x, 0) / pts.length, y: pts.reduce((t, q) => t + q.y, 0) / pts.length};
    const r = Math.max(18, ...pts.map(q => Math.hypot(q.x - c.x, q.y - c.y) + DOT + 8));
    if (c.x < 0 || c.y < 0 || c.x > W || c.y > H) continue;
    const el = fumettoGruppo(g);
    labels.appendChild(el);
    items.push({v: {mmsi: 'gruppo:' + g.z.nome, color: COLORE_GRUPPO, age: 0}, gruppo: g, pts, p: c, r,
                el, w: el.offsetWidth, h: el.offsetHeight});
  }
  if (sel && !visibili.some(o => o.v.mmsi === sel)) sel = null;      // barca uscita dalla vista
  disegnaScala();
  disegnaArrivi(items.map(it => it.p), W, H);
  const sc = document.getElementById('scala');
  if (sc.style.display !== 'none') {
    const r = sc.getBoundingClientRect();
    sc.classList.add('trasparente');               // pannello sempre trasparente
  }
  place(items, W, H);
}

// ---------- pannello "barche in scala" ----------
// Sagome di barche in vista laterale, prua a destra. SOLO linee dritte (poligoni).
// Coordinate: x 0..100 = lunghezza (poppa -> prua), y verso il basso, galleggiamento y = 0.
// Tutte usano lo stesso scafo base e le stesse misure di finestre/aste, per uno stile uniforme.

const P = pts => 'M' + pts.map(p => p.join(',')).join(' L') + ' Z';
const RET = (x, y, w, h) => P([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);

// scafo base: bordo libero h a poppa, la prua si alza di 'sal', prua inclinata dritta
function scafo(h, sal = 3, prua = 12) {
  return P([[0, -h], [100, -h - sal], [100 - prua, 0], [3, 0]]);
}
// finestra a nastro (parallelogramma) e oblo' quadrati in fila
const NASTRO = (x1, x2, y, h = 2.2, incl = 0) => P([[x1, y], [x2, y - incl], [x2, y - incl + h], [x1, y + h]]);
const OBLO = (x0, n, passo, y, l = 2.4) => Array.from({length: n}, (_, i) => RET(x0 + i * passo, y, l, l));
// quota del ponte nel punto x (leggermente sotto, per sovrapporsi allo scafo senza fessure)
const PONTE = (x, h, sal) => -h - sal * x / 100 + 0.8;
const ASTA = (x, y1, y2, sp = 1.4) => RET(x, y2, sp, y1 - y2);

// tipo AIS (testo) -> sagoma
function sagomaPerTipo(tipo, lunghezza) {
  const t = (tipo || '').toLowerCase();
  if (/sail/.test(t)) {                    // vela: sagoma in base alla lunghezza
    if (!lunghezza) return 'vela';
    if (lunghezza < 12) return 'velaPiccola';
    if (lunghezza < 24) return 'vela';
    if (lunghezza < 40) return 'ketch';
    return 'goletta';
  }
  if (/fish/.test(t)) return 'pesca';
  if (/tug|tow/.test(t)) return 'rimorchiatore';
  if (/passenger|ferry|cruise/.test(t)) return 'passeggeri';
  if (/tanker/.test(t)) return 'cisterna';
  if (/cargo|container|bulk/.test(t)) return 'cargo';
  if (/pilot|search|rescue|law|port|high speed|military/.test(t)) return 'gommone';
  // diporto e sconosciuti: sagoma in base alla lunghezza
  if (!lunghezza) return 'yacht';
  if (lunghezza < 8) return 'motoscafo';
  if (lunghezza < 15) return 'cabinato';
  if (lunghezza < 24) return 'yacht';
  if (lunghezza < 40) return 'superyacht';
  return 'megayacht';
}

function svgSagoma(nome, w, colore) {
  const s = SAGOME[nome], h = (s.bottom - s.top) * w / 100;
  const p = (d, f) => `<path d="${d}" fill="${f}"/>`;
  return {
    h,
    svg: `<svg width="${w}" height="${h}" viewBox="0 ${s.top} 100 ${s.bottom - s.top}" shape-rendering="geometricPrecision">` +
         (s.sotto || []).map(d => p(d, '#fff')).join('') +
         s.d.map(d => p(d, colore)).join('') + s.bianco.map(d => p(d, '#fff')).join('') + '</svg>',
  };
}

function disegnaScala() {
  const box = document.getElementById('scala');
  const conL = ordine.map(k => vessels.find(v => v.mmsi === k)).filter(v => v && v.len > 0);
  const senza = vessels.filter(v => !(v.len > 0));
  if (!vessels.length || !pannelloVisibile) { box.style.display = 'none'; return; }
  box.style.display = '';
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  const larg = box.clientWidth - 24 * s;
  const maxL = Math.max(...conL.map(v => v.len), 1);
  const altMax = innerHeight * 64.0 / 100 - 110 * s;      // spazio per le sagome
  // scala unica (pixel per metro): la barca piu' lunga occupa tutta la larghezza,
  // ma se le sagome non ci stanno in altezza si riduce tutto insieme
  let ppm = larg / maxL;
  for (let k = 0; k < 6; k++) {
    let tot = 0;
    for (const v of conL) tot += svgSagoma(sagomaPerTipo(v.type, v.len), v.len * ppm, v.color).h + 22 * s;
    if (tot <= altMax) break;
    ppm *= Math.max(0.5, altMax / tot);
  }
  let html = '<h3>Barche in scala</h3>';
  for (const v of conL) {
    const sg = svgSagoma(sagomaPerTipo(v.type, v.len), v.len * ppm, v.color);
    html += '<div class="riga' + (v.age > SBIADISCI ? ' vecchia' : '') + (v.mmsi === sel ? ' sel' : '') + '"><div class="top"><span class="nm"><i style="background:' +
            v.color + '"></i>' + esc(v.name) + '</span><span class="lm">' + fmtM(v.len) + (v.wid ? ' × ' + fmtM(v.wid) : '') +
            ' m</span></div>' + sg.svg + '</div>';
  }
  // righello con la stessa scala: tacche e numeri proporzionati alla finestra, numeri sotto la linea
  const fs = 13 * s;                                        // grandezza dei numeri
  const passo = [1, 2, 5, 10, 20, 50, 100].find(p => p * ppm >= fs * 4.2) || 100;   // abbastanza spazio tra i numeri (anche per "60 m")
  const nTacche = Math.max(1, Math.min(Math.floor(larg / (passo * ppm)), Math.ceil(maxL / passo)));
  const yL = 2 * s, hT = 7 * s, yN = yL + hT + fs * 1.05;   // linea, altezza tacche, riga dei numeri
  const sw = Math.max(1, 1.6 * s);
  let r = '<svg width="' + larg + '" height="' + (yN + fs * 0.35) + '" style="overflow:visible">' +
          '<line x1="0" y1="' + yL + '" x2="' + (nTacche * passo * ppm) + '" y2="' + yL + '" stroke="#345" stroke-width="' + sw + '"/>';
  // tacche piccole senza numero tra quelle grandi (ogni metro, 2 o 5 m a seconda del passo)
  const fine = [1, 2, 5, 10, 20].filter(f => passo % f === 0 && f < passo).find(f => f * ppm >= 5 * s);
  if (fine) for (let m = fine; m < nTacche * passo; m += fine) {
    if (m % passo === 0) continue;
    const x = m * ppm;
    r += '<line x1="' + x + '" y1="' + yL + '" x2="' + x + '" y2="' + (yL + hT * 0.5) + '" stroke="#345" stroke-width="' + sw * 0.7 + '"/>';
  }
  for (let i = 0; i <= nTacche; i++) {
    const x = i * passo * ppm;
    const ancora = i === 0 ? 'start' : (i === nTacche ? 'end' : 'middle');
    r += '<line x1="' + x + '" y1="' + yL + '" x2="' + x + '" y2="' + (yL + hT) + '" stroke="#345" stroke-width="' + sw + '"/>' +
         '<text x="' + x + '" y="' + yN + '" font-size="' + fs + '" font-weight="600" fill="#234" text-anchor="' + ancora + '">' +
         (i * passo) + (i === nTacche ? ' m' : '') + '</text>';
  }
  html += '<div class="righello">' + r + '</svg></div>';
  if (senza.length) html += '<div class="nd">Senza misure: ' + senza.map(v => esc(v.name)).join(', ') + '</div>';
  box.innerHTML = html;
}
function fmtM(x) { return Number.isInteger(x) ? x : x.toFixed(1); }

function overlap(a, b, g) {
  const x = Math.min(a.x + a.w + g, b.x + b.w) - Math.max(a.x - g, b.x);
  const y = Math.min(a.y + a.h + g, b.y + b.h) - Math.max(a.y - g, b.y);
  return (x > 0 && y > 0) ? x * y : 0;
}
function nearest(p, r) {
  return {x: Math.max(r.x, Math.min(p.x, r.x + r.w)), y: Math.max(r.y, Math.min(p.y, r.y + r.h))};
}
function segHitsRect(p, q, r) {          // il segmento p-q attraversa il rettangolo r?
  for (let t = 0.08; t < 0.95; t += 0.08) {
    const x = p.x + (q.x - p.x) * t, y = p.y + (q.y - p.y) * t;
    if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) return true;
  }
  return false;
}

let ultimaDisposizione = {chiave: '', rc: {}};
function place(items, W, H) {
  const M = 6;
  const dotRects = items.map(it => it.gruppo
    ? {x: it.p.x - it.r, y: it.p.y - it.r, w: 2 * it.r, h: 2 * it.r, it}
    : {x: it.p.x - DOT - 3, y: it.p.y - DOT - 3, w: 2 * DOT + 6, h: 2 * DOT + 6, it});
  // zone vietate: pannelli, pulsanti, barra di stato -> nessun fumetto ci puo' andare sopra
  const vietate = zoneOccupate();
  const arr = document.getElementById('arrivi');
  if (arr && arr.style.display === 'block') {
    const b = arr.getBoundingClientRect();
    vietate.push({x: b.left - 8, y: b.top - 8, w: b.width + 16, h: b.height + 16});
  }
  for (const it of items)
    it.n = items.filter(o => Math.hypot(o.p.x - it.p.x, o.p.y - it.p.y) < 300).length;
  // ordine fisso (prima i gruppi, poi le zone affollate): NON dipende dalla barca selezionata,
  // cosi' cambiando selezione i fumetti restano dove sono
  items.sort((a, b) => (!!b.gruppo - !!a.gruppo) || b.n - a.n || a.p.y - b.p.y || String(a.v.mmsi).localeCompare(String(b.v.mmsi)));
  const placed = [];
  const chiave = [W, H, map.getZoom().toFixed(4), map.getCenter().lat.toFixed(6), map.getCenter().lng.toFixed(6),
                  JSON.stringify(vietate.map(v => [Math.round(v.x), Math.round(v.y), Math.round(v.w), Math.round(v.h)])),
                  items.map(it => it.v.mmsi + '@' + Math.round(it.p.x) + ',' + Math.round(it.p.y) +
                                  (it.gruppo ? ':' + it.gruppo.membri.map(v => v.mmsi).join('+') : '')).sort().join('|')].join('#');
  if (chiave === ultimaDisposizione.chiave && items.every(it => ultimaDisposizione.rc[it.v.mmsi])) {
    for (const it of items) {
      const c = ultimaDisposizione.rc[it.v.mmsi];
      if (c.compatto) { const img = it.el.querySelector('img'); if (img) img.remove(); it.el.classList.add('compatto'); }
      const w = it.el.offsetWidth, h = it.el.offsetHeight;
      // se il fumetto cambia misura (es. il gruppo mostra la foto) resta attaccato dal lato verso il suo pallino
      const x = (c.x + c.w / 2 < it.p.x) ? c.x + c.w - w : c.x;
      const y = (c.y + c.h / 2 < it.p.y) ? c.y + c.h - h : c.y;
      const rc = {x, y, w, h};
      placed.push({p: it.p, rc, it});
      it.el.style.left = rc.x + 'px';
      it.el.style.top = rc.y + 'px';
    }
    dotRects.push(...vietate.map(v => ({...v, vietata: true})));
    disegnaLinee(placed, dotRects);
    return;
  }
  const cerca = (it, raggi) => {
    let best = null, bestScore = Infinity;
    for (const r0 of raggi) {
      const r = Math.max(r0 * K, LINK_MIN) + (it.r || 0);   // i gruppi partono dal bordo del loro cerchio
      for (const a of ANGLES) {
        const dx = Math.cos(a), dy = Math.sin(a);
        const cx = it.p.x + dx * (r + it.w / 2), cy = it.p.y + dy * (r + it.h / 2);
        const rc = {x: cx - it.w / 2, y: cy - it.h / 2, w: it.w, h: it.h};
        if (rc.x < M || rc.y < M || rc.x + rc.w > W - M || rc.y + rc.h > H - M) continue;
        if (vietate.some(v => overlap(rc, v, 0) > 0)) continue;              // vietato: si scarta
        if (dotRects.some(d => !(it.gruppo && d.it === it) && overlap(rc, d, 8) > 0)) continue;   // mai sopra un pallino
        const fine = nearest(it.p, rc);
        // linea visibile di almeno LINK_MIN - DOT pixel anche quando il fumetto e' in diagonale
        if (Math.hypot(fine.x - it.p.x, fine.y - it.p.y) < (it.r || DOT) + LINK_MIN - DOT) continue;
        // linea sotto un pannello (non vale per il pannello sotto cui si trova la barca stessa)
        if (vietate.some(v => !dentro(it.p, v, 0) && segHitsRect(it.p, fine, v))) continue;
        let ov = 0, cross = 0;
        for (const q of placed) { ov += overlap(rc, q.rc, GAP); if (segHitsRect(it.p, fine, q.rc)) cross++; }
        for (const d of dotRects) if (!(it.gruppo && d.it === it)) ov += overlap(rc, d, 8);   // margine attorno ai pallini
        for (const q of placed) if (segHitsRect(q.p, nearest(q.p, q.rc), rc)) cross++;
        const score = ov * 50 + cross * 60 + r;
        if (ov === 0 && cross <= 1) return {rc, libero: true};
        if (score < bestScore) { bestScore = score; best = rc; }
      }
    }
    return best ? {rc: best, libero: false} : null;
  };
  for (const it of items) {
    let ris = cerca(it, RADII);
    if (!ris || !ris.libero) {                       // poco spazio: fumetto compatto (senza foto)
      const img = it.el.querySelector('img');
      if (img) {
        img.remove(); it.el.classList.add('compatto');
        it.w = it.el.offsetWidth; it.h = it.el.offsetHeight;
        const r2 = cerca(it, RADII);
        if (r2 && (!ris || r2.libero || !ris.libero)) ris = r2;
      }
    }
    if (!ris || !ris.libero) {                       // ultima risorsa: piu' lontano
      const r3 = cerca(it, [760, 900, 1050]);
      if (r3 && (!ris || r3.libero)) ris = r3;
    }
    const best = ris ? ris.rc : {x: Math.min(Math.max(it.p.x + 20, M), W - it.w - M),
                                 y: Math.min(Math.max(it.p.y - it.h - 20, M), H - it.h - M), w: it.w, h: it.h};
    placed.push({p: it.p, rc: best, it});
    it.el.style.left = best.x + 'px';
    it.el.style.top = best.y + 'px';
  }
  ultimaDisposizione = {chiave, rc: {}};
  for (const pl of placed)
    ultimaDisposizione.rc[pl.it.v.mmsi] = {...pl.rc, compatto: pl.it.el.classList.contains('compatto')};
  dotRects.push(...vietate.map(v => ({...v, vietata: true})));
  disegnaLinee(placed, dotRects);
}

// --- linee: dritte se la strada e' libera, altrimenti curve che aggirano fumetti e barche ---
function quad(a, c, b, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push({x: u*u*a.x + 2*u*t*c.x + t*t*b.x, y: u*u*a.y + 2*u*t*c.y + t*t*b.y});
  }
  return pts;
}
function dentro(pt, r, g) { return pt.x > r.x - g && pt.x < r.x + r.w + g && pt.y > r.y - g && pt.y < r.y + r.h + g; }
function incrocio(a, b, c, d) {
  const o = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  return (o(a, b, c) * o(a, b, d) < 0) && (o(c, d, a) * o(c, d, b) < 0);
}
// ---------- barche in arrivo ----------
// ogni barca in arrivo ha un colore tutto suo, molto diverso dagli altri, e lo tiene finche' resta
// in arrivo: lo stesso colore per la freccia sul bordo e per il pallino nel riquadro "In arrivo"
const COLORI_ARRIVI = ['#e6194b', '#1f5bff', '#ff8c00', '#18a84a', '#9b1fd1', '#ff2fd2',
                       '#00c8e0', '#ffd400', '#8b4513', '#111111', '#9ad400', '#000080'];
const coloreArrivo = {};                        // nome -> indice del colore
function coloraArrivi() {
  const nomi = arrivi.map(a => String(a.name || '?'));
  for (const n of Object.keys(coloreArrivo)) if (!nomi.includes(n)) delete coloreArrivo[n];   // colori liberi
  for (const a of arrivi) {
    const n = String(a.name || '?');
    if (!(n in coloreArrivo)) {
      const usati = new Set(Object.values(coloreArrivo));
      let i = 0;
      while (usati.has(i) && i < COLORI_ARRIVI.length - 1) i++;
      coloreArrivo[n] = i;
    }
    a.color = COLORI_ARRIVI[coloreArrivo[n]];
  }
}
function tempo(min) {
  if (min < 1) return 'ora';
  if (min < 60) return 'tra ' + Math.round(min) + ' min';
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return 'tra ' + h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
}
function num1(x) { return String(x).replace('.', ','); }
// posizioni candidate del riquadro "In arrivo" (frazioni della finestra: x = centro, y = bordo basso)
// la prima e' quella preferita (in basso al centro, sul mare); se li' ci sono barche si passa alla successiva
const POSTI_ARRIVI = [[0.46, 0.95], [0.34, 0.95], [0.58, 0.95], [0.46, 0.7], [0.34, 0.45], [0.46, 0.3]];
let postoArrivi = 0;
function zoneOccupate() {
  // pannelli e pulsanti fissi: nessun fumetto o pannello mobile ci puo' andare sopra
  return ['scala', 'stato', 'aiuto', 'intera'].map(id => document.getElementById(id))
    .filter(e => e && getComputedStyle(e).display !== 'none' && getComputedStyle(e).visibility !== 'hidden')
    .map(e => { const r = e.getBoundingClientRect(); return {x: r.left - 8, y: r.top - 8, w: r.width + 16, h: r.height + 16}; });
}
function disegnaArrivi(punti, W, H) {
  const box = document.getElementById('arrivi');
  if (!arrivi.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  let h = '<h3>In arrivo</h3>';
  for (const a of arrivi) {
    h += '<div class="a"><div class="r1"><span class="nm"><i style="background:' + a.color + '"></i>' + esc(a.name) +
         '</span><span class="eta">' + tempo(a.eta) + '</span></div><div class="r2">' + num1(a.dist) + ' NM · ' +
         num1(a.speed) + ' nodi' + (a.len ? ' · ' + fmtM(a.len) + ' m' : '') + '</div></div>';
  }
  h += '<div class="nota">stima in linea retta da rotta e velocit&agrave;</div>';
  box.innerHTML = h;
  // scelta del posto: senza barche (con margine per i loro fumetti) e senza pannelli/pulsanti
  const bw = box.offsetWidth, bh = box.offsetHeight, marg = 60, fissi = zoneOccupate();
  const rett = i => {
    const [fx, fy] = POSTI_ARRIVI[i];
    const x = Math.min(Math.max(fx * W - bw / 2, 8), W - bw - 8), y = Math.min(Math.max(fy * H - bh, 8), H - bh - 8);
    return {x, y, w: bw, h: bh};
  };
  const costo = r => punti.filter(p => p.x > r.x - marg && p.x < r.x + r.w + marg && p.y > r.y - marg && p.y < r.y + r.h + marg).length * 10
                   + fissi.reduce((t, f) => t + (overlap(r, f, 0) > 0 ? 1000 : 0), 0);
  // si resta dove si e' finche' il posto e' libero (niente salti a ogni aggiornamento)
  if (costo(rett(postoArrivi)) > 0) {
    let migliore = 0, cMin = Infinity;
    POSTI_ARRIVI.forEach((_, i) => { const c = costo(rett(i)); if (c < cMin) { cMin = c; migliore = i; } });
    postoArrivi = migliore;
  }
  const r = rett(postoArrivi);
  box.style.left = r.x + 'px';
  box.style.top = r.y + 'px';
}

// freccia sul bordo della mappa nel punto in cui la barca entrera' (senza scritta: il colore la collega
// alla riga del riquadro "In arrivo"). Sta sempre all'altezza giusta: se proprio cade dentro un pannello
// si sposta di lato, mai su o giu', cosi' indica sempre da dove arrivera' la barca.
function frecceArrivi() {
  const fr = document.getElementById('frecce');
  fr.innerHTML = '';
  const W = innerWidth, H = innerHeight, M = 12, R = 11;            // margine dal bordo, "raggio" della freccia
  const pannelli = ['scala', 'arrivi', 'ess-colonna', 'ess-scheda'].map(id => document.getElementById(id))
    .filter(e => e && e.getClientRects().length).map(e => e.getBoundingClientRect());
  for (const a of arrivi) {
    const p = map.latLngToContainerPoint([a.ing_lat, a.ing_lon]);
    let x = Math.min(Math.max(p.x, M), W - M), y = Math.min(Math.max(p.y, M), H - M);
    for (const r of pannelli) {
      if (x + R > r.left && x - R < r.right && y + R > r.top && y - R < r.bottom) {
        if (y <= M + 1 || y >= H - M - 1) x = (x - r.left < r.right - x) ? r.left - R - 4 : r.right + R + 4;   // bordo alto/basso
        else x = (x - r.left < r.right - x) ? Math.max(M, r.left - R - 4) : r.right + R + 4;                    // bordo sinistro/destro
      }
    }
    const g = 'translate(' + x + ',' + y + ') rotate(' + a.course + ')';
    fr.insertAdjacentHTML('beforeend',
      '<g transform="' + g + '"><path d="M0,-11 L8,7 L0,3 L-8,7 Z" fill="' + a.color +
      '" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></g>');
  }
}

function disegnaLinee(placed, dotRects) {
  const fatte = [];
  // evidenziazione gialla della barca selezionata: disegnata per PRIMA, cosi' sta dietro
  // a tutte le linee e a tutti i pallini (il pallino selezionato resta comunque davanti agli altri)
  for (const pl of placed) {
    let ps = null;
    if (pl.it.gruppo) { const i = pl.it.gruppo.membri.findIndex(v => v.mmsi === sel); if (i >= 0) ps = pl.it.pts[i]; }
    else if (pl.it.v.mmsi === sel) ps = pl.p;
    if (ps) svg.insertAdjacentHTML('beforeend',
      '<circle cx="' + ps.x + '" cy="' + ps.y + '" r="' + (DOT + 8) + '" fill="rgba(255,212,0,.35)" stroke="#ffd400" stroke-width="3"/>');
  }
  // prima le linee piu' lunghe (sono quelle con meno scelta)
  const ordine = placed.slice().sort((a, b) =>
    Math.hypot(b.rc.x - b.p.x, b.rc.y - b.p.y) - Math.hypot(a.rc.x - a.p.x, a.rc.y - a.p.y));
  for (const pl of ordine) {
    let a = pl.p;
    const b = nearest(a, pl.rc);
    if (pl.it.gruppo) {                               // la linea del gruppo parte dal bordo del cerchio
      const dd = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      a = {x: a.x + (b.x - a.x) / dd * pl.it.r, y: a.y + (b.y - a.y) / dd * pl.it.r};
    }
    const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const nx = -(b.y - a.y) / L, ny = (b.x - a.x) / L;
    // sempre un po' curva; se serve, curva di piu' per aggirare gli ostacoli
    const base = Math.max(12 * K, 0.22 * L);
    const OFF = [1, -1, 1.6, -1.6, 2.4, -2.4, 0.5, -0.5, 3.4, -3.4].map(f => f * base);
    let best = null, bestScore = Infinity;
    for (const o of OFF) {
      const c = {x: (a.x + b.x) / 2 + nx * o, y: (a.y + b.y) / 2 + ny * o};
      const pts = quad(a, c, b, 24);
      let hit = 0, cross = 0;
      for (let i = 2; i < pts.length - 2; i++) {
        for (const q of placed) if (q !== pl && dentro(pts[i], q.rc, 4)) hit++;
        for (const d of dotRects) if (d.it !== pl.it && dentro(pts[i], d, 0) && Math.hypot(pts[i].x - a.x, pts[i].y - a.y) > 2 * DOT) hit += d.vietata ? 20 : 1;
      }
      for (const f of fatte)
        for (let i = 1; i < pts.length; i++)
          for (let j = 1; j < f.length; j++)
            if (incrocio(pts[i-1], pts[i], f[j-1], f[j])) cross++;
      const score = hit * 100 + cross * 40 + Math.abs(o) / base;
      if (score < bestScore) { bestScore = score; best = {c, pts}; }
      if (hit === 0 && cross === 0) break;
    }
    fatte.push(best.pts);
    // parte dal CENTRO del cerchio e finisce un po' DENTRO il fumetto: entrambi stanno sopra
    // la linea, quindi le estremita' sono coperte e il collegamento e' pieno
    const cx = pl.rc.x + pl.rc.w / 2, cy = pl.rc.y + pl.rc.h / 2;
    const dc = Math.hypot(cx - b.x, cy - b.y) || 1, entra = Math.min(12, dc);
    const e = {x: b.x + (cx - b.x) / dc * entra, y: b.y + (cy - b.y) / dc * entra};
    const d = 'M' + a.x + ',' + a.y + ' Q' + best.c.x + ',' + best.c.y + ' ' + e.x + ',' + e.y;
    svg.insertAdjacentHTML('beforeend',
      '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="' + d + '" fill="none" stroke="' + pl.it.v.color + '" stroke-width="2.5" stroke-linecap="round"' +
      (pl.it.v.age > SBIADISCI ? ' stroke-dasharray="6 5"' : '') + '/>');
  }
  // cerchi delle barche: dopo le linee, quindi sopra di esse (i fumetti stanno ancora piu' sopra)
  let selDaDisegnare = null;                          // la selezionata si disegna per ultima: sta sopra a tutte
  const pallino = (v, p, ultimo) => {
    if (v.mmsi === sel && !ultimo) { selDaDisegnare = [v, p]; return; }
    const vecchia = v.age > SBIADISCI;
    svg.insertAdjacentHTML('beforeend',
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + DOT + '" fill="#fff" stroke="#fff" stroke-width="2"/>' +
      '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + DOT + '" fill="' + v.color + '"' +
      (vecchia ? ' fill-opacity="0.45"' : '') + ' stroke="#fff" stroke-width="2"/>' +
      '<circle class="hit" cx="' + p.x + '" cy="' + p.y + '" r="' + (DOT + 9) + '" fill="transparent"' +
      ' data-lat="' + v.lat + '" data-lon="' + v.lon + '"/>');
  };
  for (const pl of placed) {
    if (!pl.it.gruppo) continue;                      // gruppi: cerchio tratteggiato e pallini delle barche
    svg.insertAdjacentHTML('beforeend',
      '<circle cx="' + pl.p.x + '" cy="' + pl.p.y + '" r="' + pl.it.r + '" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="4"/>' +
      '<circle cx="' + pl.p.x + '" cy="' + pl.p.y + '" r="' + pl.it.r + '" fill="none" stroke="' + COLORE_GRUPPO + '" stroke-width="2" stroke-dasharray="6 5"/>');
    pl.it.gruppo.membri.forEach((v, i) => pallino(v, pl.it.pts[i]));
  }
  for (const pl of placed) if (!pl.it.gruppo) pallino(pl.it.v, pl.p);
  if (selDaDisegnare) pallino(selDaDisegnare[0], selDaDisegnare[1], true);
  frecceArrivi();
}


// ===================================================================================================
// MENU OPZIONI (tasto Menu del telecomando, M sulla tastiera in prova) e TEMA ESSENZIALE
// ===================================================================================================
// rotta e velocita' stimate dalle ultime posizioni (l'AIS di VesselFinder non le manda)
function rottaStimata(v) {
  if (!inMovimento(v)) return null;
  const st = storiaPos[v.mmsi], ora = Date.now();
  const q = st.find(p => ora - p.t <= 10 * 60000 && distM(p, v) > MOVIMENTO_M);
  if (!q) return null;
  const dy = (v.lat - q.lat) * 111320, dx = (v.lon - q.lon) * 111320 * Math.cos(v.lat * Math.PI / 180);
  const sec = Math.max(30, (ora - q.t) / 1000);
  return {rotta: (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360, nodi: Math.hypot(dx, dy) / sec * 1.94384};
}
const PUNTI = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
function tipoIt(v) {
  const t = String(v.type || '').toLowerCase();
  if (/sail/.test(t)) return 'Barca a vela';
  if (/fish/.test(t)) return 'Peschereccio';
  if (/tug|tow/.test(t)) return 'Rimorchiatore';
  if (/passenger|ferry/.test(t)) return 'Traghetto';
  if (/cargo|container|bulk/.test(t)) return 'Mercantile';
  if (/tanker/.test(t)) return 'Cisterna';
  if (/law|military/.test(t)) return 'Forze dell\'ordine';
  if (/search|rescue/.test(t)) return 'Soccorso';
  if (/pilot/.test(t)) return 'Pilota';
  if (/high speed/.test(t)) return 'Unità veloce';
  return 'Imbarcazione da diporto';
}
const numIt = x => String(Math.round(x * 10) / 10).replace('.', ',');
function sagomaSvg(v, w, piena) {
  const s = SAGOME[sagomaPerTipo(v.type, v.len)], h = (s.bottom - s.top) * w / 100;
  return {h, svg: '<svg width="' + w + '" height="' + h + '" viewBox="0 ' + s.top + ' 100 ' + (s.bottom - s.top) + '"><g fill="currentColor"' +
                  (piena ? '' : ' opacity=".3"') + '>' + s.d.map(d => '<path d="' + d + '"/>').join('') + '</g></svg>'};
}
// "foto" quando manca: la sagoma della barca sull'orizzonte
function fotoSagoma(v) {
  const s = SAGOME[sagomaPerTipo(v.type, v.len)], w = 34 + (v.len || 12) * 1.6, h = (s.bottom - s.top) * w / 100, x = (300 - w) / 2, y = 128;
  const corpo = '<g transform="translate(' + x + ',' + (y - h * (-s.top) / (s.bottom - s.top)) + ') scale(' + w / 100 + ')"><g transform="translate(0,' + (-s.top) + ')">' +
                s.d.map(d => '<path d="' + d + '"/>').join('') + '</g></g>';
  const svgF = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200"><defs>' +
    '<linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ea2ad"/><stop offset=".62" stop-color="#d9d6cf"/><stop offset=".64" stop-color="#e6e1d8"/></linearGradient>' +
    '<linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#53707e"/><stop offset="1" stop-color="#1e3039"/></linearGradient></defs>' +
    '<rect width="300" height="129" fill="url(#c)"/><rect y="128" width="300" height="72" fill="url(#m)"/>' +
    '<g fill="#1b262c">' + corpo + '</g><g fill="#1b262c" opacity=".18" transform="translate(0,' + (2 * y) + ') scale(1,-1)">' + corpo + '</g></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgF);
}

// colonna in scala: una barca per riga, tutte allineate a sinistra e alla stessa scala (0,8 rem per metro se c'e' posto)
function colonnaScala(lista, larg, altMax) {
  const conL = lista.filter(v => v.len > 0), senza = lista.filter(v => !(v.len > 0));
  let html = '';
  if (conL.length) {
    const RIGA = remPx(2.5), maxL = Math.max(...conL.map(v => v.len));
    const alt = (v, p) => sagomaSvg(v, v.len * p).h + RIGA;
    const tot = p => conL.reduce((t, v) => t + alt(v, p), 0);
    let ppm = Math.min(larg * 0.75 / maxL, remPx(.8));
    for (let k = 0; k < 4 && tot(ppm) > altMax; k++) ppm = Math.max(remPx(.8) * 0.4, ppm * altMax / tot(ppm));
    const dentro = []; let h = 0;
    for (const v of conL) { const a = alt(v, ppm); if (h + a > altMax + 2) break; dentro.push(v); h += a; }
    const scelta = conL.find(v => v.mmsi === sel);
    if (scelta && !dentro.includes(scelta)) {                 // la barca selezionata si vede sempre
      while (dentro.length && h + alt(scelta, ppm) > altMax) h -= alt(dentro.pop(), ppm);
      dentro.push(scelta); dentro.sort((a, b) => conL.indexOf(a) - conL.indexOf(b));
    }
    for (const v of dentro)
      html += '<div class="riga-s' + (v.mmsi === sel ? ' sel' : '') + (v.age > SBIADISCI ? ' vecchia' : '') + '"><div class="top"><i style="background:' + v.color + '"></i><em>' +
              esc(v.name) + '</em><span>' + fmtM(v.len) + ' m</span></div>' + sagomaSvg(v, v.len * ppm, v.mmsi === sel).svg + '</div>';
    const passo = [2, 5, 10, 20, 50].find(p => p * ppm >= remPx(3)) || 50, n = Math.max(1, Math.min(Math.floor(larg / (passo * ppm)), Math.ceil(maxL / passo)));
    html += '<svg width="' + larg + '" height="' + remPx(1.8) + '" style="overflow:visible;margin-top:.4rem" stroke="var(--ink3)" fill="var(--ink2)"><line x1="0" x2="' + n * passo * ppm + '" y1="1" y2="1"/>';
    for (let k = 0; k <= n; k++) html += '<line x1="' + k * passo * ppm + '" x2="' + k * passo * ppm + '" y1="1" y2="' + remPx(.4) + '"/><text stroke="none" x="' + k * passo * ppm +
         '" y="' + remPx(1.35) + '" font-size="' + remPx(.75) + '" text-anchor="' + (k ? (k === n ? 'end' : 'middle') : 'start') + '">' + k * passo + (k === n ? ' m' : '') + '</text>';
    html += '</svg>';
    const fuori = conL.filter(v => !dentro.includes(v));
    if (fuori.length) html += '<div class="altre">Altre ' + fuori.length + ': ' + fuori.map(v => esc(v.name)).join(', ') + '</div>';
  }
  if (senza.length) html += '<div class="altre">Senza misure: ' + senza.map(v => (v.mmsi === sel ? '<b style="color:var(--ink)">' + esc(v.name) + '</b>' : esc(v.name))).join(', ') + '</div>';
  return html;
}

// sezioni della colonna, nello stesso ordine dei tasti Su/Giu: prima i gruppi (porti, zone), poi le barche libere
let ordineEss = [], selPrima = null, ultimoStato = {testo: '', err: false};
function sezioniEss() {
  const vis = new Set(visibili.map(o => o.v.mmsi));
  const perLung = (a, b) => ((b.len > 0) - (a.len > 0)) || (b.len || 0) - (a.len || 0) || String(a.name).localeCompare(String(b.name));
  const sez = gruppiAttuali.map(g => ({nome: g.z.nome, gruppo: g, barche: g.membri.filter(v => vis.has(v.mmsi)).sort(perLung)})).filter(s => s.barche.length);
  const nelGruppo = new Set(gruppiAttuali.flatMap(g => g.membri.map(v => v.mmsi)));
  const libere = visibili.map(o => o.v).filter(v => !nelGruppo.has(v.mmsi)).sort(perLung);
  if (libere.length) sez.push({nome: sez.length ? 'In mare' : 'In vista', barche: libere});
  return sez;
}

function renderEss() {
  aggiornaScala();
  dots.clearLayers(); labels.innerHTML = ''; svg.innerHTML = '';
  const W = innerWidth, H = innerHeight;
  gruppiAttuali = calcolaGruppi();
  visibili = [];
  for (const v of vessels) {
    const p = map.latLngToContainerPoint([v.lat, v.lon]);
    if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) continue;
    visibili.push({v, p});
  }
  if (sel && !visibili.some(o => o.v.mmsi === sel)) sel = null;
  const sez = sezioniEss();
  ordineEss = sez.flatMap(s => s.barche.map(v => v.mmsi));
  const v = barcaSel();
  const gSel = v ? gruppoDi(v.mmsi) : null;

  // ---------- segni sulla mappa
  let m = '';
  const nelGruppo = new Set(gruppiAttuali.flatMap(g => g.membri.map(x => x.mmsi)));
  const centri = gruppiAttuali.map(g => {
    const pts = g.membri.map(x => map.latLngToContainerPoint([x.lat, x.lon]));
    return {g, x: pts.reduce((t, q) => t + q.x, 0) / pts.length, y: pts.reduce((t, q) => t + q.y, 0) / pts.length};
  });
  for (const o of visibili) {
    if (nelGruppo.has(o.v.mmsi)) continue;
    const x = o.v, r = rottaStimata(x), scelta = x.mmsi === sel;
    m += '<div class="s" style="left:' + o.p.x + 'px;top:' + o.p.y + 'px">' +
         (r ? '<div class="rotta" style="--c:' + x.color + ';transform:rotate(' + (r.rotta - 90) + 'deg)"></div>' : '') +
         '<div class="p' + (scelta ? ' sel' : '') + (x.age > SBIADISCI ? ' vecchia' : '') + '" style="--c:' + x.color + '"></div>' +
         (scelta ? '<div class="np" style="left:1.1rem;top:-.8rem">' + esc(x.name) + '</div>' : '') + '</div>';
  }
  // gruppi: un'etichetta col nome del porto e i colori delle sue barche, spostata dalla parte opposta al gruppo vicino
  for (const c of centri) {
    if (c.x < 0 || c.y < 0 || c.x > W || c.y > H) continue;
    let vx = 0, vy = 1, dmin = Infinity;
    for (const d of centri) if (d !== c) {
      const dd = Math.hypot(c.x - d.x, c.y - d.y);
      if (dd < dmin && dd < remPx(14)) { dmin = dd; vx = (c.x - d.x) / (dd || 1); vy = (c.y - d.y) / (dd || 1); }
    }
    const dx = vx * remPx(1.2), dy = vy * remPx(1.2);
    const qui = c.g.membri.find(x => x.mmsi === sel);
    m += '<div class="s" style="left:' + c.x + 'px;top:' + c.y + 'px"><div class="centro"></div>' +
         '<div class="pill' + (qui ? ' qui' : '') + '" style="left:' + dx + 'px;top:' + dy + 'px">' + esc(c.g.z.nome) + '<span class="pp">' +
         c.g.membri.map(x => '<i class="' + (x.mmsi === sel ? 'sel' : '') + '" style="background:' + x.color + '"></i>').join('') + '</span></div>' +
         (qui ? '<div class="np" style="left:' + dx + 'px;top:' + (dy + (vy >= 0 ? remPx(1.4) : -remPx(2.9))) + 'px;transform:translateX(-50%)">' + esc(qui.name) + '</div>' : '') + '</div>';
  }
  document.getElementById('ess-mappa').innerHTML = m;
  // etichette dei gruppi che si toccano: si scostano in verticale (con il nome della barca scelta)
  const gruppiS = [...document.querySelectorAll('#ess-mappa .s')].filter(e => e.querySelector('.pill'));
  for (let giro = 0; giro < 4; giro++) {
    let mosso = false;
    for (let i = 0; i < gruppiS.length; i++) for (let j = i + 1; j < gruppiS.length; j++) {
      const a = gruppiS[i].querySelector('.pill').getBoundingClientRect(), b = gruppiS[j].querySelector('.pill').getBoundingClientRect();
      const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left) + 8, oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) + 6;
      if (ox <= 0 || oy <= 0) continue;
      const giu = b.top >= a.top ? gruppiS[j] : gruppiS[i], su = giu === gruppiS[j] ? gruppiS[i] : gruppiS[j];
      for (const [el, d] of [[giu, oy / 2], [su, -oy / 2]])
        el.querySelectorAll('.pill, .np').forEach(x => { x.style.top = (parseFloat(x.style.top) + d) + 'px'; });
      mosso = true;
    }
    if (!mosso) break;
  }

  // ---------- testata
  const ora = new Date(), hh = String(ora.getHours()).padStart(2, '0') + ':' + String(ora.getMinutes()).padStart(2, '0');
  const inMov = vessels.filter(inMovimento).length;
  const testata = '<div class="testata"><h1>Gallipoli</h1><p' + (ultimoStato.err ? ' class="err"' : '') + '>' + hh + '&nbsp;&nbsp;' +
    (ultimoStato.err ? esc(ultimoStato.testo) : vessels.length + ' barche' + (inMov ? ', ' + inMov + ' in movimento' : '')) + '</p></div>';

  // ---------- colonna
  const sezAperta = sez.find(s => s.barche.some(x => x.mmsi === sel)) || sez[0];
  const nArr = arrivi.length;
  const altMax = H - remPx(7) - remPx(2.6) * (sez.length - 1) - (nArr ? remPx(2.2) + remPx(1.8) * nArr : 0) - remPx(2.6) - remPx(2.6);
  let col = '';
  for (const s of sez) {
    if (s === sezAperta) col += '<div class="gruppo-aperto"><div class="t">' + esc(s.nome) + '<span>' + s.barche.length + (s.barche.length === 1 ? ' barca' : ' barche') + '</span></div>' +
                               colonnaScala(s.barche, remPx(24), altMax) + '</div>';
    else col += '<div class="gruppo-chiuso">' + esc(s.nome) + '<span class="pallini">' + s.barche.map(x => '<i style="background:' + x.color + '"></i>').join('') +
                '</span><b>' + s.barche.length + '</b></div>';
  }
  if (nArr) col += '<div class="arrivi"><h3>In arrivo</h3>' + arrivi.map(a => '<div><i style="background:' + a.color + '"></i>' + esc(a.name) + '<span>' + tempo(a.eta) + '</span></div>').join('') + '</div>';

  // ---------- scheda della barca selezionata
  let scheda;
  if (v) {
    const r = rottaStimata(v);
    const dove = gSel ? (/^Zona/.test(gSel.z.nome) ? 'ferma in ' : 'nel ') + gSel.z.nome : r ? 'in navigazione verso ' + PUNTI[Math.round(r.rotta / 45) % 8] : 'ferma';
    const foto = v.photo ? urlFoto(v.photo) : fotoSagoma(v);
    const ok = gSel ? '<div class="entra-in"><kbd>OK</kbd>apri ' + esc(gSel.z.nome) + '</div>' : v.photo ? '<div class="entra-in"><kbd>OK</kbd>foto grande</div>' : '';
    scheda = '<div class="scheda cambia' + (sel !== selPrima ? ' prima' : '') + '" id="ess-scheda"><div class="foto"><img alt="" src="' + foto + '"></div>' +
      '<div><h2 class="nome">' + esc(v.name) + '</h2><p class="sotto">' + tipoIt(v) + ', ' + dove + '</p><div class="dati">' +
      '<div><b>' + (v.len ? fmtM(v.len) + '<small>m</small>' : '–') + '</b>lunghezza</div>' +
      '<div><b>' + (v.wid ? fmtM(v.wid) + '<small>m</small>' : '–') + '</b>larghezza</div>' +
      '<div><b>' + (r ? numIt(r.nodi) + '<small>nodi</small>' : '0<small>nodi</small>') + '</b>velocità' + (r ? ' stimata' : '') + '</div>' +
      '<div><b>' + (v.age < 1 ? 'adesso' : quando(v.age)) + '</b>' + (v.age < 1 ? 'rilevata' : 'fa, ultima rilevazione') + '</div>' +
      '</div>' + ok + '</div></div>';
  } else {
    scheda = '<div class="scheda" id="ess-scheda"><div></div><div class="vuota">Usa &#x25B2;&#x25BC; per scegliere una barca</div></div>';
  }
  const aiuto = '<div class="aiuto"><span>&#x25B2;&#x25BC; barca</span><span>&#x25C0;&#x25B6; vicina</span><span>OK apri</span><span>&#x25B6;&#x275A;&#x275A; zoom</span><span>&#x2630; menu</span><span>&#x21A9; indietro</span></div>';
  document.getElementById('ess-ui').innerHTML = testata + '<div class="colonna" id="ess-colonna">' + col + '</div>' + scheda + aiuto;
  if (sel !== selPrima) {
    selPrima = sel;
    requestAnimationFrame(() => requestAnimationFrame(() => { const e = document.getElementById('ess-scheda'); if (e) e.classList.remove('prima'); }));
  }
  frecceArrivi();
}
setInterval(() => { if (essenziale()) render(); }, 30 * 1000);       // l'ora in alto
</script></body></html>
